line-length = 110
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "S310", "S311"]

[lint.per-file-ignores]
"tests/**" = ["S101"]
"notebooks/**" = ["E501", "E402", "S101", "S603", "S607", "B007"]
"train/train.py" = ["PLC0415"]

[lint.isort]
known-first-party = ["ml", "sadu"]

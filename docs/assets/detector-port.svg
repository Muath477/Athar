<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 446" width="940" height="446" role="img" aria-label="The DamageDetector port with five adapters: Claude, a ready model over HTTP, a per-cell classifier, Athar's own fine-tuned Qwen model, or manual labelling">
<title>The DamageDetector port with five adapters: Claude, a ready model over HTTP, a per-cell classifier, Athar's own fine-tuned Qwen model, or manual labelling</title>
<style>

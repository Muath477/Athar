<rect width="940" height="446" rx="18" fill="#efe4d2"/>
<text x="40" y="44" font-size="18" font-weight="700">One port, five ways to find damage</text>
<text x="40" y="68" font-size="13" class="muted">Switch with one setting. The map, review and treatment plan stay the same.</text>
<rect x="40" y="213" width="170" height="70" rx="10" fill="#1f1a16"/><text x="125" y="244" text-anchor="middle" font-size="15" font-weight="700" class="light">mapping</text><text x="125" y="265" text-anchor="middle" font-size="12" fill="#efe4d2" fill-opacity="0.7">rectified wall + grid</text>
<rect x="300" y="203" width="210" height="90" rx="10" fill="#f8f2e8" stroke="#8f1f1a" stroke-width="2" stroke-dasharray="6 4"/><text x="405" y="241" text-anchor="middle" font-size="15" font-weight="700">DamageDetector</text><text x="405" y="263" text-anchor="middle" font-size="12" class="muted">detect(image, grid) → cells</text>
<path d="M210 248 h82" stroke="#7a5434" stroke-width="2"/><path d="M292 242 l8 6 l-8 6 z" fill="#7a5434"/>
<path d="M510 248 C 560 248, 560 116, 610 116" stroke="#b3804f" stroke-width="1.5" fill="none"/>
<rect class="hl0" x="606" y="88" width="300" height="56" rx="10" fill="#8f1f1a"/>
<rect x="610" y="92" width="292" height="48" rx="8" fill="#f8f2e8"/>
<text x="626" y="113" font-size="14" font-weight="700">Claude</text><text x="626" y="131" font-size="12" class="muted">vision API, labelled grid</text>
<text class="env0" x="40" y="416" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#8f1f1a">SADU_DAMAGE_DETECTOR=claude</text>
<circle class="pk0" cx="0" cy="0" r="6" fill="#8f1f1a"/>
<path d="M510 248 C 560 248, 560 182, 610 182" stroke="#b3804f" stroke-width="1.5" fill="none"/>
<rect class="hl1" x="606" y="154" width="300" height="56" rx="10" fill="#8f1f1a"/>
<rect x="610" y="158" width="292" height="48" rx="8" fill="#f8f2e8"/>
<text x="626" y="179" font-size="14" font-weight="700">Ready model</text><text x="626" y="197" font-size="12" class="muted">Hugging Face or own server</text>
<text class="env1" x="40" y="416" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#8f1f1a">SADU_DAMAGE_DETECTOR=http_detection</text>
<circle class="pk1" cx="0" cy="0" r="6" fill="#8f1f1a"/>
<path d="M510 248 C 560 248, 560 248, 610 248" stroke="#b3804f" stroke-width="1.5" fill="none"/>
<rect class="hl2" x="606" y="220" width="300" height="56" rx="10" fill="#8f1f1a"/>
<rect x="610" y="224" width="292" height="48" rx="8" fill="#f8f2e8"/>
<text x="626" y="245" font-size="14" font-weight="700">Cell classifier</text><text x="626" y="263" font-size="12" class="muted">one request per cell</text>
<text class="env2" x="40" y="416" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#8f1f1a">SADU_DAMAGE_DETECTOR=http_cell_classification</text>
<circle class="pk2" cx="0" cy="0" r="6" fill="#8f1f1a"/>
<path d="M510 248 C 560 248, 560 314, 610 314" stroke="#b3804f" stroke-width="1.5" fill="none"/>
<rect class="hl3" x="606" y="286" width="300" height="56" rx="10" fill="#8f1f1a"/>
<rect x="610" y="290" width="292" height="48" rx="8" fill="#f8f2e8"/>
<text x="626" y="311" font-size="14" font-weight="700">Own model</text><text x="626" y="329" font-size="12" class="muted">Qwen3.5-4B, LoRA fine-tuned</text>
<text class="env3" x="40" y="416" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#8f1f1a">SADU_DAMAGE_DETECTOR=qwen</text>
<circle class="pk3" cx="0" cy="0" r="6" fill="#8f1f1a"/>
<path d="M510 248 C 560 248, 560 380, 610 380" stroke="#b3804f" stroke-width="1.5" fill="none"/>
<rect class="hl4" x="606" y="352" width="300" height="56" rx="10" fill="#8f1f1a"/>
<rect x="610" y="356" width="292" height="48" rx="8" fill="#f8f2e8"/>
<text x="626" y="377" font-size="14" font-weight="700">Manual</text><text x="626" y="395" font-size="12" class="muted">expert draws the map</text>
<text class="env4" x="40" y="416" font-size="14" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#8f1f1a">SADU_DAMAGE_DETECTOR=none</text>
<circle class="pk4" cx="0" cy="0" r="6" fill="#8f1f1a"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" width="800" height="345" role="img" aria-label="Change detection between two approved wall maps: new, worse, retyped, improved and resolved cells">
<title>Change detection between two approved wall maps: new, worse, retyped, improved and resolved cells</title>
<style>
text{font-family:'Segoe UI',Tahoma,'Noto Sans','Noto Naskh Arabic',sans-serif}
text:not([fill]):not(.light):not(.muted){fill:#1f1a16}
.muted{fill:#7a5434}
.light{fill:#efe4d2}
@keyframes ch0{0%{opacity:0} 20%{opacity:0} 23%{opacity:1} 90%{opacity:1} 96%{opacity:0} 100%{opacity:0}}
.ch0{animation:ch0 9s linear infinite}
@keyframes ch1{0%{opacity:0} 32%{opacity:0} 35%{opacity:1} 90%{opacity:1} 96%{opacity:0} 100%{opacity:0}}
.ch1{animation:ch1 9s linear infinite}
@keyframes ch2{0%{opacity:0} 44%{opacity:0} 47%{opacity:1} 90%{opacity:1} 96%{opacity:0} 100%{opacity:0}}
.ch2{animation:ch2 9s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="800" height="345" rx="18" fill="#efe4d2"/>
<text x="40" y="44" font-size="18" font-weight="700">Each new map is compared with the last approved one</text>
<text x="40" y="84" font-size="13" class="muted">Approved map · March</text>
<rect x="40" y="96" width="272" height="170" fill="#b3804f"/>
<rect x="108" y="130" width="34" height="34" fill="#c0392b" fill-opacity="0.65"/>
<rect x="108" y="164" width="34" height="34" fill="#c0392b" fill-opacity="0.65"/>
<rect x="210" y="232" width="34" height="34" fill="#e67e22" fill-opacity="0.65"/>
<rect x="244" y="232" width="34" height="34" fill="#e67e22" fill-opacity="0.65"/>
<rect x="278" y="96" width="34" height="34" fill="#2471a3" fill-opacity="0.65"/>
<g class="g" stroke="#efe4d2" stroke-opacity="0.7" stroke-width="1"><line x1="74.0" y1="96" x2="74.0" y2="266"/><line x1="108.0" y1="96" x2="108.0" y2="266"/><line x1="142.0" y1="96" x2="142.0" y2="266"/><line x1="176.0" y1="96" x2="176.0" y2="266"/><line x1="210.0" y1="96" x2="210.0" y2="266"/><line x1="244.0" y1="96" x2="244.0" y2="266"/><line x1="278.0" y1="96" x2="278.0" y2="266"/><line x1="40" y1="130.0" x2="312" y2="130.0"/><line x1="40" y1="164.0" x2="312" y2="164.0"/><line x1="40" y1="198.0" x2="312" y2="198.0"/><line x1="40" y1="232.0" x2="312" y2="232.0"/></g>
<text x="440" y="84" font-size="13" class="muted">New map · today</text>
<rect x="440" y="96" width="272" height="170" fill="#b3804f"/>
<rect x="508" y="130" width="34" height="34" fill="#c0392b" fill-opacity="0.65"/>
<rect x="508" y="164" width="34" height="34" fill="#c0392b" fill-opacity="0.65"/>
<rect x="508" y="198" width="34" height="34" fill="#c0392b" fill-opacity="0.65"/>
<rect x="610" y="232" width="34" height="34" fill="#e67e22" fill-opacity="0.65"/>
<rect x="644" y="232" width="34" height="34" fill="#e67e22" fill-opacity="0.65"/>
<rect x="576" y="232" width="34" height="34" fill="#e67e22" fill-opacity="0.65"/>
<g class="g" stroke="#efe4d2" stroke-opacity="0.7" stroke-width="1"><line x1="474.0" y1="96" x2="474.0" y2="266"/><line x1="508.0" y1="96" x2="508.0" y2="266"/><line x1="542.0" y1="96" x2="542.0" y2="266"/><line x1="576.0" y1="96" x2="576.0" y2="266"/><line x1="610.0" y1="96" x2="610.0" y2="266"/><line x1="644.0" y1="96" x2="644.0" y2="266"/><line x1="678.0" y1="96" x2="678.0" y2="266"/><line x1="440" y1="130.0" x2="712" y2="130.0"/><line x1="440" y1="164.0" x2="712" y2="164.0"/><line x1="440" y1="198.0" x2="712" y2="198.0"/><line x1="440" y1="232.0" x2="712" y2="232.0"/></g>
<rect class="ch0" x="511" y="201" width="28" height="28" fill="none" stroke="#efe4d2" stroke-width="3" stroke-dasharray="5 3"/>
<rect class="ch1" x="579" y="235" width="28" height="28" fill="none" stroke="#efe4d2" stroke-width="3" stroke-dasharray="5 3"/>
<rect class="ch2" x="681" y="99" width="28" height="28" fill="none" stroke="#1f1a16" stroke-width="3" stroke-dasharray="5 3"/>
<text x="40" y="300" font-size="13">Dashed cells: <tspan font-weight="700">new</tspan> (the crack spreads down, plaster loss grows) and <tspan font-weight="700">resolved</tspan> (moisture repaired).</text>
<text x="40" y="320" font-size="13" class="muted">Worse, retyped and improved cells are flagged the same way.</text>
</svg>

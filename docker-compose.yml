name: sadu

x-api-env: &api-env
  SADU_ENV: ${SADU_ENV:-dev}
  SADU_PUBLIC_ORIGIN: ${SADU_PUBLIC_ORIGIN:-http://localhost:3000}
  DATABASE_URL: postgresql+psycopg://sadu:${POSTGRES_PASSWORD:-dev}@db:5432/sadu
  S3_ENDPOINT_URL: http://storage:8333
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devkey}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecret123}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
  AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
  SADU_DEMO_MODE: ${SADU_DEMO_MODE:-false}
  SADU_DAILY_LLM_BUDGET_USD: ${SADU_DAILY_LLM_BUDGET_USD:-10}
  SENTRY_DSN_API: ${SENTRY_DSN_API:-}
  SADU_DAMAGE_DETECTOR: ${SADU_DAMAGE_DETECTOR:-claude}
  SADU_DETECTOR_URL: ${SADU_DETECTOR_URL:-}
  SADU_DETECTOR_TOKEN: ${SADU_DETECTOR_TOKEN:-}
  SADU_DETECTOR_LABELS: ${SADU_DETECTOR_LABELS:-}
  SADU_DETECTOR_MIN_SCORE: ${SADU_DETECTOR_MIN_SCORE:-0.35}
  SADU_MAP_ROWS: ${SADU_MAP_ROWS:-8}

services:
  db:
    build: infra/db
    image: sadu-db:dev
    environment:
      POSTGRES_USER: sadu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: sadu
    volumes: [db-data:/var/lib/postgresql]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadu -d sadu"]
      interval: 5s
      retries: 20

  storage:
    image: chrislusf/seaweedfs:4.54
    entrypoint: ["/bin/sh", "/start.sh"]
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-devkey}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devsecret123}
    volumes:
      - ./infra/storage/start.sh:/start.sh:ro
      - storage-data:/data
    ports: ["127.0.0.1:8333:8333"]

  migrate:
    build: backend
    image: sadu-api:dev
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: backend
    image: sadu-api:dev
    command: ["python", "-m", "sadu.cli", "seed", "--pack", "demo"]
    environment: *api-env
    volumes: ["./region-packs:/region-packs:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_started }

  api:
    build: backend
    image: sadu-api:dev
    environment: *api-env
    volumes:
      - ./region-packs:/region-packs:ro
      - demo-cache:/app/demo-cache
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_started }

  web:
    build: frontend
    image: sadu-web:dev
    environment:
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  caddy:
    image: caddy:2.11.9-alpine
    profiles: [prod]
    environment:
      SADU_DOMAIN: ${SADU_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [web, api, storage]

volumes:
  db-data:
  storage-data:
  demo-cache:
  caddy-data:
